[project]
name = "inventory-risk-advisor-backend"
version = "0.1.0"
description = "Smart Inventory & Supply Chain Risk Advisor Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1.post1",
    "lightgbm>=4.3.0",
    "prophet>=1.1.5",
    "pymupdf>=1.23.26",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.6",
    "groq>=0.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
    "pytest>=8.1.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
